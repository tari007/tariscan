<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111a2e">
  <title>TariScan POS | Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172033;font:16px system-ui,-apple-system,sans-serif}
    main{max-width:420px;text-align:center;background:#fff;padding:32px;border:1px solid #e1e6ef;border-radius:18px;box-shadow:0 12px 40px #1720330d}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:16px;background:#3157d5;color:white;font-size:30px;font-weight:800}
    h1{font-size:23px;margin:0 0 10px}p{line-height:1.65;color:#667087;font-size:14px}
    button{margin-top:12px;border:0;border-radius:9px;background:#3157d5;color:white;padding:12px 18px;font-weight:700}
  </style>
</head>
<body><main><div class="mark">T</div><h1>You are currently offline</h1><p>TariScan could not load this page without an internet connection. Your saved local records remain in this browser. Reconnect and reload to continue.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
